<style> 
          body {
             margin: 0;
             font-family: 'segoe UI', sans-serif;
             background-color: #fff7f9;
        } 

nav { 
      display: flex;
      justify-content: center;
      padding: 15px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
     } 

nav a { 
      margin: 0 15px;
      text-decoration: none;
      color: #c06c84; 
      } 

nav a:hover { 
             color: #e89cae;
            } 

header { 
          background: linear-gradient(to right, #fbd3e9, #bbd2c5);
          padding: 70px 20px;
          text-align: center;
          border-bottom-left-radius: 40px;
          border-bottom-right-radius: 40px;
  } 


header h1 { 
            color: #5a3e4d;
         } 

section { 
          display: flex;
          justify-content: center;
          align-items:center;
          padding: 60px 20px;
          text-align: center;
          width: 100%;
          margin: auto;
      } 

form { 
       max-width: 400px;
       margin-align: auto;
       width: 100%;
     } 

input, textarea { 
                  width: 100%;
                  padding: 12px;
                  margin: 10px 0;
                  border-radius: 10px;
                  border: 1px solid #ddd;
            } 

button { 
         background: #e89cae;
         color: white;
         padding: 12px 25px;
         border: none;
         border-radius: 25px;
         cursor: pointer;
       }   

.content-box { 
               background: #ffe4ec;
               padding: 40px;
               border-radius: 25px;
               width: 100%;
               max-width: 900px;
               margin: 0 auto;
               text-align: center;
               box-shadow: 0 10px 25px rgba(232, 156, 174, 0.2);
               animation: fadeIn 1s ease-in;
     } 
.content-box:hover { 
                     box-shadow: 0 0 40px rgba(232, 156, 174, 0.4);
                  } 


</style>
